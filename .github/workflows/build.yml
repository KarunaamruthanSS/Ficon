name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pointless second run on the same ref wastes minutes and muddies the logs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[heic,docs,dev]"
      - name: ruff
        run: python -m ruff check --output-format=github .
      - name: mypy
        run: python -m mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[heic,docs,dev]"
      - name: pytest
        run: python -m pytest -q
      - name: Converter runs from a clean install
        run: offconv --help

  # A Windows .exe can only be built on Windows, so this job mirrors
  # build_exe.bat rather than reimplementing it.
  build-exe:
    needs: [lint, test]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[heic,docs,dev]"
      - name: PyInstaller
        run: >
          python -m PyInstaller --onefile --console --name offconv --paths src
          --collect-all pillow_heif --collect-all pymupdf --collect-all pdf2docx
          --clean --noconfirm run.py
      - name: The built exe actually starts
        run: dist\offconv.exe --help
      - name: The built exe can convert a document
        shell: pwsh
        run: |
          # The document libraries are the ones most likely to be left
          # out of a bundle, and --help would not notice.
          "hello from CI" | Out-File ci-check.txt -Encoding utf8
          dist\offconv.exe convert ci-check.txt --to pdf
          if (-not (Test-Path ci-check.pdf)) { throw "no PDF was produced" }
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\offconv.exe -Algorithm SHA256).Hash.ToLower()
          "$h  offconv.exe" | Out-File dist\offconv.exe.sha256 -Encoding ascii
          Write-Host $h
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/offconv.exe
      - uses: actions/upload-artifact@v4
        with:
          name: offconv-windows-x64
          path: |
            dist/offconv.exe
            dist/offconv.exe.sha256
          if-no-files-found: error

  # The Linux single file, mirroring build.sh. Built here for the same
  # reason as the .exe: a runner has no Python or Pillow on it, so a
  # bundle that forgot to include something fails here and would have
  # passed on a developer's own machine.
  build-linux:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[heic,docs,dev]"
      - name: PyInstaller
        run: >
          python -m PyInstaller --onefile --console --name offconv --paths src
          --collect-all pillow_heif --collect-all pymupdf --collect-all pdf2docx
          --clean --noconfirm run.py
      - name: The built file actually starts
        run: ./dist/offconv --help
      - name: The built file can convert a document
        run: |
          # The document libraries are the ones most likely to be left
          # out of a bundle, and --help would not notice.
          echo "hello from CI" > ci-check.txt
          ./dist/offconv convert ci-check.txt --to pdf
          test -f ci-check.pdf || { echo "no PDF was produced"; exit 1; }
      - name: SHA-256
        run: |
          cd dist
          sha256sum offconv | tee offconv.sha256
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/offconv
      - uses: actions/upload-artifact@v4
        with:
          name: offconv-linux-x64
          path: |
            dist/offconv
            dist/offconv.sha256
          if-no-files-found: error

  release:
    # Only a v* tag publishes; an ordinary push to main just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-exe, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: offconv-*
          merge-multiple: true
          path: dist
      # Published with the GitHub CLI, which is pre-installed on the
      # runner, rather than a third-party action: this job holds
      # contents: write, and the fewer outside actions that run with it
      # the smaller the thing that has to be trusted.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/offconv.exe \
            dist/offconv.exe.sha256 \
            dist/offconv \
            dist/offconv.sha256
