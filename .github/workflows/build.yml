name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pointless second run on the same ref wastes minutes and muddies the logs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[heic,dev]"
      - name: ruff
        run: python -m ruff check --output-format=github .
      - name: mypy
        run: python -m mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[heic,dev]"
      - name: pytest
        run: python -m pytest -q
      - name: Converter runs from a clean install
        run: offconv --help

  # A Windows .exe can only be built on Windows, so this job mirrors
  # build_exe.bat rather than reimplementing it.
  build-exe:
    needs: [lint, test]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[heic,dev]"
      - name: PyInstaller
        run: >
          python -m PyInstaller --onefile --console --name offconv --paths src
          --collect-all pillow_heif --clean --noconfirm run.py
      - name: The built exe actually starts
        run: dist\offconv.exe --help
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\offconv.exe -Algorithm SHA256).Hash.ToLower()
          "$h  offconv.exe" | Out-File dist\offconv.exe.sha256 -Encoding ascii
          Write-Host $h
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/offconv.exe
      - uses: actions/upload-artifact@v4
        with:
          name: offconv-windows-x64
          path: |
            dist/offconv.exe
            dist/offconv.exe.sha256
          if-no-files-found: error

  release:
    # Only a v* tag publishes; an ordinary push to main just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offconv-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/offconv.exe
            dist/offconv.exe.sha256
          generate_release_notes: true
