[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offconv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A warning from a decoder is something to look at, not scroll past.
filterwarnings = ["error::DeprecationWarning", "error::SyntaxWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # likely bugs
    "UP",           # outdated syntax
    "SIM",          # needless complexity
    "RUF",
    "S",            # security: bandit rules
]
ignore = [
    "S101",  # assert is how tests are written
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, and build fake inputs.
"tests/*" = ["S105", "S106", "S108", "SLF001"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false

# pillow-heif is optional and ships no type stubs.
[[tool.mypy.overrides]]
module = ["pillow_heif"]
ignore_missing_imports = true
