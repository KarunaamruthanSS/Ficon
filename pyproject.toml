[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offconv"
version = "0.1.0"
description = "An offline file converter"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["converter", "image", "offline", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

# Pillow parses untrusted files, so the floor is a version with current
# security fixes rather than the oldest one that happens to work.
dependencies = ["pillow>=10.3"]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "pyinstaller>=6", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
offconv = "offconv.cli:main"

